<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You! 💕 - QuickPOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #FFF5F5 0%, #F0E8FF 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4A4A4A;
        }
        
        .thankyou-card {
            background: white;
            border-radius: 32px;
            padding: 60px 40px;
            max-width: 600px;
            margin: 20px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(255,150,180,0.25);
            border: 2px solid rgba(255,183,197,0.3);
            animation: fadeIn 0.6s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .emoji-big {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s ease infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        h1 {
            font-family: 'Quicksand', sans-serif;
            font-size: 2.5rem;
            color: #FFB7C5;
            margin-bottom: 16px;
        }
        
        p {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #7a7a9a;
            margin-bottom: 32px;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #FFB7C5, #ff8fab);
            color: white;
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(255,120,160,0.35);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(255,120,160,0.45);
        }
        
        .hearts {
            margin-top: 30px;
            font-size: 20px;
            letter-spacing: 8px;
        }
    </style>
</head>
<body>
    <div class="thankyou-card">
        <div class="emoji-big">💌✨</div>
        <h1>Thank You, Beautiful! 💕</h1>
        <p>Your message has been sent with love!<br>We'll get back to you within 2 hours.<br>You're amazing! 🌸</p>
        <a href="index.php" class="btn">Back to QuickPOS 🎀</a>
        <div class="hearts">💖 💕 🌸 ✨ 💗</div>
    </div>
</body>
</html>
